<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Image to Editable PowerPoint</title>
  <desc id="desc">A diagram image is reconstructed as editable text, shapes, and arrows. The illustration shows separate selection handles on the PowerPoint elements.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="540" gradientUnits="userSpaceOnUse"><stop stop-color="#101B33"/><stop offset="1" stop-color="#17254C"/></linearGradient>
    <linearGradient id="accent" x1="824" y1="80" x2="1510" y2="450" gradientUnits="userSpaceOnUse"><stop stop-color="#66D9C1"/><stop offset="1" stop-color="#7195FF"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#B5CAFF" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1600" height="540" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="540" rx="24" fill="url(#grid)"/>
  <path d="M1127 0V540M0 460H1600" stroke="#B5CAFF" stroke-opacity=".08"/>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <rect x="68" y="64" width="7" height="24" rx="3" fill="#72DFC5"/>
    <text x="92" y="83" font-size="19" letter-spacing="3" font-weight="700" fill="#AFC4E7">IMAGE TO EDITABLE POWERPOINT</text>
    <text x="65" y="191" font-size="62" font-weight="700" fill="#FFFFFF">Your diagram.</text>
    <text x="65" y="270" font-size="62" font-weight="700" fill="#88E5D1">Ready to edit.</text>
    <text x="68" y="326" font-size="25" fill="#B9C7DE">Rebuild diagram structure. Keep editing.</text>
    <g font-size="18" fill="#DCE6F6">
      <circle cx="76" cy="393" r="4" fill="#77DCC5"/><text x="91" y="400">Native text</text>
      <circle cx="247" cy="393" r="4" fill="#77DCC5"/><text x="262" y="400">Editable shapes</text>
      <circle cx="461" cy="393" r="4" fill="#77DCC5"/><text x="476" y="400">Separate arrows</text>
    </g>
    <text x="68" y="505" font-size="17" fill="#899DBD">AGENT SKILL</text>
    <text x="240" y="505" font-size="17" fill="#899DBD">LOCAL PPTX EXPORT</text>
    <text x="1490" y="505" text-anchor="end" font-size="17" fill="#899DBD">Built with FigureForge</text>
  </g>
