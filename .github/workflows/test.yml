name: Verify editable export
on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'agents/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'agents/**'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: node --test tests/test_export.mjs
      - run: python -m unittest discover -s tests -p 'test_*.py'
  libreoffice-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering dependencies
        timeout-minutes: 8
        run: |
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$apt_source" ]; then
              sudo sed -i 's|https\?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get -o DPkg::Lock::Timeout=60 -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends libreoffice-impress poppler-utils fonts-liberation
      - run: python -m pip install -r requirements.txt
      - name: Verify actual PPTX rendering and preview reuse
        run: python -X utf8 -m unittest discover -s tests -p 'test_render_integration.py'
        env:
          TEST_LIBREOFFICE: '1'
