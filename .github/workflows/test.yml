name: Verify editable export
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: node --test tests/test_export.mjs
      - run: python -m unittest discover -s tests -p 'test_*.py'
  libreoffice-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-impress poppler-utils fonts-liberation fonts-noto-cjk
      - run: python -m pip install -r requirements.txt
      - run: python -X utf8 scripts/build_figure.py --scene tests/fixtures/scientific-text.scene.json --output build/ci/figure.pptx --renderer libreoffice
      - run: python -X utf8 -m unittest discover -s tests -p 'test_render_integration.py'
        env:
          TEST_LIBREOFFICE: '1'
